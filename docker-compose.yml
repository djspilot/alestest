services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - FREECAD_PATH=/usr/lib/freecad
      - API_KEYS=${API_KEYS:-}
      - UPLOAD_DIR=/tmp/manufacturing-uploads
      - JOB_TTL_SECONDS=3600
    volumes:
      - uploads:/tmp/manufacturing-uploads
    restart: unless-stopped

volumes:
  uploads:
