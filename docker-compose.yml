services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ales-api
    restart: unless-stopped
    environment:
      API_KEYS: ${API_KEYS:-}
      UPLOAD_DIR: /srv/alestest/uploads
      DB_PATH: /srv/alestest/data/db/manufacturing_data.db
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-100}
      JOB_TTL_SECONDS: ${JOB_TTL_SECONDS:-31536000}
      FREECAD_RUNTIME_ROOT: /opt/conda/envs/freecad
      DISABLE_STAGES: ${DISABLE_STAGES:-}
    volumes:
      - ales_uploads:/srv/alestest/uploads
      - ales_db:/srv/alestest/data/db
    ports:
      - "8000:8000"

  viewer:
    build:
      context: .
      dockerfile: Dockerfile.viewer
      args:
        VITE_PIPELINE_API_BASE_URL: ${VITE_PIPELINE_API_BASE_URL:-http://localhost:8000}
    container_name: ales-viewer
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  ales_uploads:
  ales_db:
