name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_API: ghcr.io/aidoel/alestest-api

jobs:
  build:
    name: Build & push API image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API (full unfold runtime + embedded viewer)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ${{ env.IMAGE_API }}:latest,${{ env.IMAGE_API }}:${{ github.sha }}
          build-args: |
            VITE_PIPELINE_API_BASE_URL=${{ secrets.VITE_PIPELINE_API_BASE_URL }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: [self-hosted, ales-vps]
    needs: build
    environment: production

    steps:
      - name: Checkout (for compose file)
        uses: actions/checkout@v4

      - name: Copy compose file & deploy
        run: |
          cp docker-compose.prod.yml /srv/alestest/docker-compose.prod.yml
          /srv/alestest/deploy.sh
