name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:  # handmatig triggeren via GitHub UI

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/alestest-api
  IMAGE_VIEWER: ghcr.io/${{ github.repository_owner }}/alestest-viewer

jobs:
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API (lite)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api.lite
          push: true
          tags: ${{ env.IMAGE_API }}:latest,${{ env.IMAGE_API }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build & push viewer
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.viewer
          push: true
          tags: ${{ env.IMAGE_VIEWER }}:latest,${{ env.IMAGE_VIEWER }}:${{ github.sha }}
          cache-from: type=gha,scope=viewer
          cache-to: type=gha,scope=viewer,mode=max
          build-args: |
            VITE_PIPELINE_API_BASE_URL=${{ secrets.VITE_PIPELINE_API_BASE_URL }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: /srv/alestest/deploy.sh
