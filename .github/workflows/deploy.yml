name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_API: ghcr.io/aidoel/alestest-api

jobs:
  build:
    name: Build & push API image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Build & push API (full unfold runtime + embedded viewer)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ${{ env.IMAGE_API }}:latest,${{ env.IMAGE_API }}:${{ github.sha }}
          build-args: |
            VITE_PIPELINE_API_BASE_URL=${{ secrets.VITE_PIPELINE_API_BASE_URL }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: [self-hosted, ales-vps]
    needs: build
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Pull latest & restart API
        run: |
          cd /opt/manufacturing-api
          git fetch origin
          git reset --hard origin/main
          docker compose build api
          docker rm -f ales-api || true
          docker compose up -d api
