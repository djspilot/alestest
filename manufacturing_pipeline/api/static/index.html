<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALES API</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #f5f7fb; color: #111827; font-size: 13px; -webkit-font-smoothing: antialiased; }

  header { display: flex; align-items: center; gap: 16px; padding: 18px 24px; border-bottom: 1px solid #d8dee8; background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%); }
  header h1 { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; color: #0f172a; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #94a3b8; flex-shrink: 0; transition: background 0.3s, box-shadow 0.3s; }
  .dot.ok { background: #22c55e; box-shadow: 0 0 8px #22c55e88; }
  .dot.err { background: #ef4444; box-shadow: 0 0 8px #ef444488; }
  .uptime { margin-left: auto; color: #64748b; font-size: 11px; }

  .key-bar { display: flex; gap: 8px; padding: 12px 24px; background: #eef2f7; border-bottom: 1px solid #d8dee8; }
  .key-bar input { flex: 1; background: #ffffff; border: 1px solid #cbd5e1; color: #111827; padding: 6px 10px; border-radius: 4px; font-family: inherit; font-size: 12px; }
  .key-bar input:focus { outline: none; border-color: #64748b; box-shadow: 0 0 0 3px rgba(100,116,139,0.12); }
  .key-bar input::placeholder { color: #94a3b8; }
  .key-bar button { background: #ffffff; border: 1px solid #cbd5e1; color: #0f172a; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 12px; }
  .key-bar button:hover { background: #e2e8f0; color: #020617; }

  .stats { display: flex; gap: 1px; background: #d8dee8; border-bottom: 1px solid #d8dee8; }
  .stat { flex: 1; padding: 16px 20px; background: #ffffff; transition: background 0.15s; }
  .stat:hover { background: #fafbfe; }
  .stat-label { color: #64748b; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; font-weight: 500; }
  .stat-value { font-size: 24px; font-weight: 800; color: #0f172a; font-variant-numeric: tabular-nums; }
  .stat-value.green { color: #16a34a; }
  .stat-value.red { color: #dc2626; }
  .stat-value.yellow { color: #ca8a04; }

  .toolbar { display: flex; align-items: center; gap: 12px; padding: 10px 24px; border-bottom: 1px solid #d8dee8; background: #ffffff; }
  .toolbar span { color: #64748b; font-size: 11px; }
  .refresh-btn { margin-left: auto; background: #ffffff; border: 1px solid #cbd5e1; color: #334155; padding: 5px 14px; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 11px; font-weight: 500; transition: all 0.15s; }
  .refresh-btn:hover { border-color: #94a3b8; color: #0f172a; background: #f1f5f9; }
  a.docs-link { color: #475569; font-size: 11px; text-decoration: none; }
  a.docs-link:hover { color: #0f172a; }

  .upload-bar { display: flex; align-items: center; gap: 10px; padding: 12px 24px; background: #eef2f7; border-bottom: 1px solid #d8dee8; }
  .upload-btn { background: #16a34a; border: 1px solid #15803d; color: #ffffff; padding: 7px 18px; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 600; transition: background 0.15s; }
  .upload-btn:hover { background: #15803d; }
  .upload-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #uploadInput { display: none; }
  #uploadStatus { font-size: 11px; color: #64748b; }

  table { width: 100%; border-collapse: collapse; }
  thead tr { border-bottom: 2px solid #d8dee8; background: #f8fafc; }
  th { padding: 9px 12px; text-align: left; font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
  tbody tr { border-bottom: 1px solid #e5e7eb; transition: background 0.15s; background: #ffffff; }
  tbody tr:hover { background: #f8fafc; }
  td { padding: 10px 12px; color: #334155; }
  td.file { color: #0f172a; font-weight: 600; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; font-size: 11px; color: #475569; }

  .badge { display: inline-block; padding: 3px 9px; border-radius: 4px; font-size: 10px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .badge.completed { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
  .badge.failed    { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
  .badge.processing{ background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
  .badge.queued    { background: #e0e7ff; color: #3730a3; border: 1px solid #a5b4fc; }
  .badge.idle      { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }
  .badge.unfold-completed { background: #ccfbf1; color: #115e59; border: 1px solid #5eead4; }
  .badge.assembly { background: #e0e7ff; color: #4338ca; border: 1px solid #a5b4fc; }

  .action-cell { min-width: 210px; }

  .assembly-parts { display: none; background: #f8fafc; }
  .assembly-parts.open { display: table-row-group; }
  .assembly-part-row td { padding: 6px 12px 6px 32px; border-bottom: 1px solid #e5e7eb; color: #475569; font-size: 11px; }
  .assembly-part-row td.part-name { color: #0f172a; font-weight: 500; }
  .expand-btn { background: #ffffff; border: 1px solid #cbd5e1; color: #334155; padding: 2px 8px; border-radius: 3px; cursor: pointer; font-family: inherit; font-size: 11px; }
  .expand-btn:hover { border-color: #94a3b8; color: #0f172a; }
  .action-stack { display: flex; flex-direction: column; gap: 6px; }
  .action-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .mini-btn, .artifact-link { background: #ffffff; border: 1px solid #cbd5e1; color: #0f172a; padding: 4px 8px; border-radius: 4px; font-family: inherit; font-size: 11px; text-decoration: none; cursor: pointer; }
  .mini-btn:hover, .artifact-link:hover { border-color: #94a3b8; color: #020617; background: #f8fafc; }
  .mini-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .download-menu { position: relative; }
  .download-menu summary { list-style: none; }
  .download-menu summary::-webkit-details-marker { display: none; }
  .download-trigger { min-width: 94px; text-align: center; }
  .download-panel { position: absolute; top: calc(100% + 6px); right: 0; z-index: 20; min-width: 200px; padding: 6px; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 6px; box-shadow: 0 12px 24px rgba(15,23,42,0.12); }
  .download-item { display: block; width: 100%; background: transparent; border: 0; color: #0f172a; text-align: left; padding: 7px 8px; border-radius: 4px; font-family: inherit; font-size: 11px; text-decoration: none; cursor: pointer; }
  .download-item:hover { background: #f1f5f9; color: #020617; }
  .download-item.disabled { color: #94a3b8; cursor: default; pointer-events: none; }
  .subtle { font-size: 10px; color: #64748b; }

  .empty { padding: 60px; text-align: center; color: #94a3b8; }
  .error-msg { padding: 12px 24px; color: #ef4444; font-size: 11px; }
  #autoRefreshLabel { font-size: 10px; color: #64748b; }

  /* Detail panel overlay */
  .detail-overlay { display: none; position: fixed; inset: 0; z-index: 100; }
  .detail-overlay.open { display: flex; }
  .detail-backdrop { position: absolute; inset: 0; background: rgba(15,23,42,0.35); }
  .detail-panel { position: absolute; top: 0; right: 0; bottom: 0; width: min(640px, 90vw); background: #ffffff; box-shadow: -8px 0 32px rgba(15,23,42,0.12); display: flex; flex-direction: column; overflow: hidden; animation: slideIn 0.15s ease-out; }
  @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
  .detail-header { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid #d8dee8; background: #f8fafc; flex-shrink: 0; }
  .detail-header h2 { font-size: 13px; font-weight: 600; color: #0f172a; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .detail-close { background: none; border: 1px solid #cbd5e1; color: #475569; width: 28px; height: 28px; border-radius: 4px; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; }
  .detail-close:hover { background: #e2e8f0; color: #0f172a; }
  .detail-body { flex: 1; overflow-y: auto; padding: 0; }
  .detail-loading { padding: 60px; text-align: center; color: #94a3b8; }

  .detail-section { padding: 16px 20px; border-bottom: 1px solid #e5e7eb; }
  .detail-section:last-child { border-bottom: none; }
  .detail-section h3 { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: #64748b; font-weight: 600; margin-bottom: 10px; }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; }
  .detail-grid.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
  .detail-item { display: flex; flex-direction: column; gap: 2px; }
  .detail-item .dlabel { font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.06em; }
  .detail-item .dvalue { font-size: 13px; color: #0f172a; font-weight: 600; }
  .detail-item .dvalue.mono { font-family: ui-monospace, monospace; font-size: 12px; font-weight: 500; color: #334155; }

  .detail-route-reason { margin-top: 8px; padding: 8px 10px; background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 4px; font-size: 11px; color: #475569; line-height: 1.5; white-space: pre-wrap; }

  .detail-table { width: 100%; border-collapse: collapse; font-size: 11px; }
  .detail-table th { text-align: left; padding: 5px 8px; font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; border-bottom: 1px solid #d8dee8; background: #f8fafc; }
  .detail-table td { padding: 5px 8px; color: #334155; border-bottom: 1px solid #f1f5f9; }
  .detail-table tr:hover td { background: #fafbfe; }

  .timeline-bar { display: flex; gap: 2px; height: 24px; border-radius: 4px; overflow: hidden; background: #e5e7eb; }
  .timeline-segment { height: 100%; min-width: 4px; position: relative; display: flex; align-items: center; justify-content: center; }
  .timeline-segment span { font-size: 8px; color: #ffffff; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 3px; }
  .timeline-legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; font-size: 10px; color: #475569; }
  .timeline-legend-item { display: flex; align-items: center; gap: 4px; }
  .timeline-legend-dot { width: 8px; height: 8px; border-radius: 2px; }

  .detail-parts-list { display: flex; flex-direction: column; gap: 8px; }
  .detail-part-card { border: 1px solid #e5e7eb; border-radius: 6px; padding: 10px 12px; background: #fafbfe; }
  .detail-part-card h4 { font-size: 11px; font-weight: 600; color: #0f172a; margin-bottom: 6px; }

  tbody tr.clickable { cursor: pointer; }
  tbody tr.clickable:hover { background: #eef2f7; }

  /* Progress bar for processing jobs */
  .progress-wrap { display: flex; flex-direction: column; gap: 3px; }
  .progress-bar { height: 6px; background: #e5e7eb; border-radius: 3px; overflow: hidden; min-width: 70px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #6366f1); border-radius: 3px; transition: width 0.4s ease; }
  .progress-label { font-size: 9px; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; }
</style>
</head>
<body>

<header>
  <div class="dot" id="healthDot"></div>
  <h1>ALES · Manufacturing API</h1>
  <span class="uptime" id="healthLabel">verbinden…</span>
</header>

<div class="key-bar">
  <input type="password" id="apiKeyInput" placeholder="API key (opgeslagen in browser)" autocomplete="off">
  <button onclick="saveKey()">Opslaan</button>
</div>

<div class="stats">
  <div class="stat"><div class="stat-label">Totaal</div><div class="stat-value" id="sTotal">—</div></div>
  <div class="stat"><div class="stat-label">Geslaagd</div><div class="stat-value green" id="sOk">—</div></div>
  <div class="stat"><div class="stat-label">Mislukt</div><div class="stat-value red" id="sFail">—</div></div>
  <div class="stat"><div class="stat-label">Bezig</div><div class="stat-value yellow" id="sProc">—</div></div>
</div>

<div class="upload-bar">
  <input type="file" id="uploadInput" accept=".step,.stp" multiple>
  <button class="upload-btn" id="uploadBtn" onclick="document.getElementById('uploadInput').click()">+ STEP uploaden</button>
  <span id="uploadStatus"></span>
</div>

<div class="toolbar">
  <span id="autoRefreshLabel"></span>
  <a class="docs-link" href="/docs" target="_blank">→ API docs</a>
  <button class="refresh-btn" onclick="loadAll()">↻ Ververs</button>
</div>

<div id="detailOverlay" class="detail-overlay">
  <div class="detail-backdrop" onclick="closeDetail()"></div>
  <div class="detail-panel">
    <div class="detail-header">
      <h2 id="detailTitle">—</h2>
      <span class="badge" id="detailBadge"></span>
      <button class="detail-close" onclick="closeDetail()">✕</button>
    </div>
    <div class="detail-body" id="detailBody">
      <div class="detail-loading">Laden…</div>
    </div>
  </div>
</div>

<div id="errorMsg" class="error-msg" style="display:none"></div>
<table>
  <thead>
    <tr>
      <th>Bestand</th>
      <th>Status</th>
      <th>Categorie</th>
      <th>Type</th>
      <th>Dikte</th>
      <th>L × B × H (mm)</th>
      <th>Gaten</th>
      <th>Zettingen</th>
      <th>Tijd</th>
      <th>Duur</th>
      <th>Acties</th>
    </tr>
  </thead>
  <tbody id="jobTable">
    <tr><td colspan="11" class="empty">Laden…</td></tr>
  </tbody>
</table>

<script>
  const KEY_STORE = 'ales_api_key';
  let apiKey = localStorage.getItem(KEY_STORE) || '';
  let refreshTimer = null;
  const REFRESH_INTERVAL = 30;
  let activeJobIds = new Set();
  let fastPollTimer = null;

  document.getElementById('apiKeyInput').value = apiKey;

  function saveKey() {
    apiKey = document.getElementById('apiKeyInput').value.trim();
    localStorage.setItem(KEY_STORE, apiKey);
    loadAll();
  }

  document.getElementById('apiKeyInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') saveKey();
  });

  function headers() {
    return apiKey ? { 'X-API-Key': apiKey } : {};
  }

  function escapeHtml(value) {
    return String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#39;');
  }

  function renderUnfoldActions(job) {
    const unfold = job.unfold || { status: 'idle' };
    const unfoldStatus = unfold.status || 'idle';
    const unfoldResult = unfold.result || null;
    const unfoldBadgeClass = unfoldStatus === 'completed' ? 'unfold-completed' : unfoldStatus;
    const statusBadge = `<span class="badge ${unfoldBadgeClass}">${escapeHtml(unfoldStatus)}</span>`;
    const canQueue = job.status === 'completed' && !['queued', 'processing'].includes(unfoldStatus);
    const unfoldError = unfold.error ? `<div class="subtle">${escapeHtml(unfold.error)}</div>` : '';
    const foldSummary = unfoldResult?.fold_lines != null
      ? `<div class="subtle">zetlijnen ${escapeHtml(unfoldResult.fold_lines)} / raw ${escapeHtml(unfoldResult.raw_fold_lines ?? '—')}</div>`
      : '';
    const downloadItems = [];
    if (job.status === 'completed') {
      const fileStem = escapeHtml((job.file_name || job.job_id).replace(/\.[^.]+$/, ''));
      downloadItems.push(
        `<a class="download-item" href="#" onclick="downloadArtifact(event,'/api/v1/jobs/${escapeHtml(job.job_id)}/downloads/total-xml','${fileStem}.xml')">Totale XML</a>`,
      );
      downloadItems.push(
        `<a class="download-item" href="#" onclick="downloadArtifact(event,'/api/v1/jobs/${escapeHtml(job.job_id)}/downloads/part-xmls','${fileStem}_xml.zip')">Losse XML's (.zip)</a>`,
      );
      if (unfoldStatus === 'completed') {
        downloadItems.push(
          `<a class="download-item" href="#" onclick="downloadArtifact(event,'/api/v1/jobs/${escapeHtml(job.job_id)}/downloads/unfold-files','${fileStem}_unfold.zip')">Unfold map (.zip)</a>`,
        );
      }
      if (unfoldResult?.flat_step_url) {
        downloadItems.push(`<a class="download-item" href="#" onclick="downloadArtifact(event,'${escapeHtml(unfoldResult.flat_step_url)}','${fileStem}_flat.step')">Flat STEP</a>`);
      }
      if (unfoldResult?.dxf_url) {
        downloadItems.push(`<a class="download-item" href="#" onclick="downloadArtifact(event,'${escapeHtml(unfoldResult.dxf_url)}','${fileStem}_flat.dxf')">DXF</a>`);
      }
    }

    const downloadMenu = downloadItems.length
      ? `<details class="download-menu">
          <summary class="mini-btn download-trigger">Downloads ▾</summary>
          <div class="download-panel">${downloadItems.join('')}</div>
        </details>`
      : '';

    const viewerBtn = job.status === 'completed'
      ? `<a class="mini-btn" href="${escapeHtml(buildViewerUrl(job.job_id, job.file_name || job.result?.file))}" target="_blank" rel="noopener" onclick="event.stopPropagation()">🔬 Viewer</a>`
      : '';

    return `
      <div class="action-stack">
        <div class="action-row">
          ${statusBadge}
          ${viewerBtn}
          <button class="mini-btn" onclick="requestUnfold('${escapeHtml(job.job_id)}')" ${canQueue ? '' : 'disabled'}>
            ${unfoldStatus === 'completed' ? 'Opnieuw unfolden' : 'Unfold'}
          </button>
          ${downloadMenu}
        </div>
        ${foldSummary}
        ${unfoldError}
      </div>
    `;
  }

  async function downloadArtifact(event, url, filename) {
    event.preventDefault();
    const errEl = document.getElementById('errorMsg');
    try {
      const r = await fetch(url, { headers: headers() });
      if (r.status === 401) throw new Error('401 — Vul een geldige API key in.');
      if (!r.ok) {
        let detail = `HTTP ${r.status}`;
        try { detail = (await r.json()).detail || detail; } catch {}
        throw new Error(detail);
      }
      const blob = await r.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 10000);
      errEl.style.display = 'none';
    } catch (e) {
      errEl.style.display = '';
      errEl.textContent = `Download mislukt: ${e.message}`;
    }
  }

  async function requestUnfold(jobId) {
    const errEl = document.getElementById('errorMsg');
    try {
      const r = await fetch(`/api/v1/jobs/${jobId}/unfold`, {
        method: 'POST',
        headers: headers(),
      });
      if (r.status === 401) throw new Error('401 — Vul een geldige API key in.');
      if (!r.ok) {
        let detail = `HTTP ${r.status}`;
        try {
          const payload = await r.json();
          detail = payload.detail || detail;
        } catch {}
        throw new Error(detail);
      }
      errEl.style.display = 'none';
      await loadJobs();
    } catch (error) {
      errEl.style.display = '';
      errEl.textContent = error.message;
    }
  }

  async function checkHealth() {
    const dot = document.getElementById('healthDot');
    const label = document.getElementById('healthLabel');
    try {
      const r = await fetch('/api/v1/health');
      if (r.ok) {
        dot.className = 'dot ok';
        label.textContent = 'online';
      } else {
        dot.className = 'dot err';
        label.textContent = `HTTP ${r.status}`;
      }
    } catch {
      dot.className = 'dot err';
      label.textContent = 'niet bereikbaar';
    }
  }

  async function loadStats() {
    try {
      const r = await fetch('/api/v1/stats', { headers: headers() });
      if (!r.ok) return;
      const d = await r.json();
      document.getElementById('sTotal').textContent = d.total ?? '—';
      document.getElementById('sOk').textContent    = d.completed ?? '—';
      document.getElementById('sFail').textContent  = d.failed ?? '—';
      document.getElementById('sProc').textContent  = d.processing ?? '—';
    } catch {}
  }

  const liveProgress = {};

  async function loadJobs() {
    activeJobIds = new Set();
    const tbody = document.getElementById('jobTable');
    const errEl = document.getElementById('errorMsg');
    try {
      const r = await fetch('/api/v1/jobs?limit=50&offset=0', { headers: headers() });
      if (r.status === 401) {
        errEl.style.display = '';
        errEl.textContent = '401 — Vul een geldige API key in.';
        tbody.innerHTML = '<tr><td colspan="11" class="empty">Geen toegang</td></tr>';
        return;
      }
      errEl.style.display = 'none';
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const data = await r.json();
      const items = data.items || [];

      if (!items.length) {
        tbody.innerHTML = '<tr><td colspan="11" class="empty">Nog geen jobs</td></tr>';
        return;
      }

      tbody.innerHTML = items.map(job => {
        const res = job.result || {};
        const isAssembly = !!res.is_assembly;
        const parts = res.parts || [];
        const prod = res.production || {};
        const dims = res.dimensions || {};
        const created = new Date(job.created_at);
        const timeStr = created.toLocaleString('nl-NL', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });

        let dur = '—';
        if (job.started_at && job.completed_at) {
          const s = (new Date(job.completed_at) - new Date(job.started_at)) / 1000;
          dur = s < 60 ? `${s.toFixed(0)}s` : `${(s/60).toFixed(1)}m`;
        }

        let cat, type, thick, holes, bends, dimStr, expandBtn = '', partRows = '';

        if (isAssembly) {
          const n = res.solid_count || parts.length;
          cat = `<span class="badge assembly">Assembly · ${n}×</span>`;
          type = '—';
          thick = '—';
          dimStr = '—';
          holes = parts.reduce((s, p) => s + (p.production?.holes_total ?? 0), 0) || '—';
          bends = parts.reduce((s, p) => s + (p.production?.bends_total ?? 0), 0) || '—';

          const rowId = `parts-${escapeHtml(job.job_id)}`;
          expandBtn = `<button class="expand-btn" onclick="toggleParts('${rowId}')">▶ Onderdelen</button>`;

          partRows = `<tr class="assembly-parts" id="${rowId}"><td colspan="11" style="padding:0">
            <table style="width:100%">
              ${parts.map((p, i) => {
                const pd = p.dimensions || {};
                const pp = p.production || {};
                const pdim = pd.length ? `${+pd.length.toFixed(1)} × ${+pd.width.toFixed(1)} × ${+pd.height.toFixed(1)}` : '—';
                const pcat = escapeHtml(p.category || p.part_type || '—');
                const pthick = p.thickness ? `${p.thickness} mm` : '—';
                return `<tr class="assembly-part-row">
                  <td class="part-name">${escapeHtml(p.solid_name || `Onderdeel ${i+1}`)}</td>
                  <td>${pcat}</td>
                  <td class="mono">${pthick}</td>
                  <td class="mono">${pdim}</td>
                  <td class="mono">${pp.holes_total ?? '—'} gaten</td>
                  <td class="mono">${pp.bends_total ?? '—'} zett.</td>
                  <td colspan="5"></td>
                </tr>`;
              }).join('')}
            </table>
          </td></tr>`;
        } else {
          dimStr = dims.length
            ? `${+dims.length.toFixed(1)} × ${+dims.width.toFixed(1)} × ${+dims.height.toFixed(1)}`
            : '—';
          cat = escapeHtml(res.category || '—');
          type = escapeHtml(res.part_type || '—');
          thick = res.thickness ? `${res.thickness} mm` : '—';
          holes = prod.holes_total ?? '—';
          bends = prod.bends_total ?? '—';
        }

        let statusCell;
        if (job.status === 'processing' || job.status === 'queued') {
          activeJobIds.add(job.job_id);
        }
        const progressData = liveProgress[job.job_id];
        if (progressData && (job.status === 'processing' || job.status === 'queued')) {
          const pct = progressData.total_steps_hint
            ? Math.min(100, Math.round((progressData.completed_step_count / progressData.total_steps_hint) * 100))
            : 0;
          const stageName = progressData.active_stage || '';
          statusCell = `<div class="progress-wrap">
            <span class="badge ${job.status}">${job.status}</span>
            <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
            <div class="progress-label">${stageName ? escapeHtml(stageName) : `${pct}%`}</div>
          </div>`;
        } else {
          statusCell = `<span class="badge ${job.status}">${job.status}</span>`;
        }
        const fname = job.file_name || res.file || job.job_id.slice(0,8);
        const actions = renderUnfoldActions(job);

        return `<tr class="clickable" onclick="openDetail('${escapeHtml(job.job_id)}')">
          <td class="file" title="${escapeHtml(fname)}">${escapeHtml(fname)}</td>
          <td>${statusCell}</td>
          <td>${cat}</td>
          <td>${type}</td>
          <td class="mono">${thick}</td>
          <td class="mono">${dimStr}</td>
          <td class="mono">${holes}</td>
          <td class="mono">${bends}</td>
          <td class="mono">${timeStr}</td>
          <td class="mono">${dur}</td>
          <td class="action-cell" onclick="event.stopPropagation()">${actions}${expandBtn ? '<div style="margin-top:6px">'+expandBtn+'</div>' : ''}</td>
        </tr>${partRows}`;
      }).join('');
    } catch (e) {
      tbody.innerHTML = `<tr><td colspan="11" class="empty">Fout: ${escapeHtml(e.message)}</td></tr>`;
    }
  }

  function startAutoRefresh() {
    if (refreshTimer) clearInterval(refreshTimer);
    let countdown = REFRESH_INTERVAL;
    const label = document.getElementById('autoRefreshLabel');
    label.textContent = `Auto-refresh over ${countdown}s`;
    refreshTimer = setInterval(() => {
      countdown--;
      if (countdown <= 0) {
        countdown = REFRESH_INTERVAL;
        loadAll();
      }
      label.textContent = `Auto-refresh over ${countdown}s`;
    }, 1000);
  }

  async function loadAll() {
    await Promise.all([checkHealth(), loadStats(), loadJobs()]);
    startAutoRefresh();
    startFastPoll();
  }

  function startFastPoll() {
    if (fastPollTimer) clearInterval(fastPollTimer);
    if (!activeJobIds.size) return;
    fastPollTimer = setInterval(async () => {
      if (!activeJobIds.size) { clearInterval(fastPollTimer); fastPollTimer = null; return; }
      const promises = [...activeJobIds].map(async (jobId) => {
        try {
          const r = await fetch(`/api/v1/jobs/${jobId}`, { headers: headers() });
          if (!r.ok) return;
          const job = await r.json();
          if (job.status === 'completed' || job.status === 'failed') {
            activeJobIds.delete(jobId);
            delete liveProgress[jobId];
            await Promise.all([loadStats(), loadJobs()]);
            return;
          }
          const ts = job.timeline_summary;
          if (ts) {
            liveProgress[jobId] = {
              completed_step_count: ts.completed_step_count || 0,
              total_steps_hint: ts.total_steps_hint || 0,
              active_stage: ts.active_stage || '',
            };
          }
          updateProgressInline(jobId);
        } catch {}
      });
      await Promise.all(promises);
    }, 3000);
  }

  function updateProgressInline(jobId) {
    const data = liveProgress[jobId];
    if (!data) return;
    const row = document.querySelector(`tr[onclick*="${jobId}"]`);
    if (!row) return;
    const statusTd = row.children[1];
    if (!statusTd) return;
    const pct = data.total_steps_hint
      ? Math.min(100, Math.round((data.completed_step_count / data.total_steps_hint) * 100))
      : 0;
    const stageName = data.active_stage || '';
    statusTd.innerHTML = `<div class="progress-wrap">
      <span class="badge processing">processing</span>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-label">${stageName ? escapeHtml(stageName) : pct + '%'}</div>
    </div>`;
  }

  document.getElementById('uploadInput').addEventListener('change', async function() {
    const files = Array.from(this.files);
    if (!files.length) return;
    const btn = document.getElementById('uploadBtn');
    const status = document.getElementById('uploadStatus');
    btn.disabled = true;
    status.textContent = `Uploaden (0/${files.length})…`;
    let done = 0;
    for (const file of files) {
      try {
        const fd = new FormData();
        fd.append('file', file);
        const r = await fetch('/api/v1/analyze', { method: 'POST', headers: headers(), body: fd });
        if (!r.ok) { status.textContent = `Fout bij ${file.name}: HTTP ${r.status}`; break; }
        done++;
        status.textContent = done < files.length ? `Uploaden (${done}/${files.length})…` : `${done} bestand(en) geüpload ✓`;
      } catch (e) {
        status.textContent = `Fout: ${e.message}`;
        break;
      }
    }
    btn.disabled = false;
    this.value = '';
    setTimeout(() => loadAll(), 500);
  });

  function toggleParts(rowId) {
    const el = document.getElementById(rowId);
    if (!el) return;
    const open = el.classList.toggle('open');
    const btn = el.previousElementSibling?.querySelector('.expand-btn');
    if (btn) btn.textContent = open ? '▼ Onderdelen' : '▶ Onderdelen';
  }

  // ── Viewer integration ──

  const VIEWER_BASE_URL = (() => {
    const host = window.location.hostname;
    if (host === 'localhost' || host === '127.0.0.1') return `http://${host}:5173`;
    return `${window.location.protocol}//${window.location.host}/viewer/`;
  })();

  function buildViewerUrl(jobId, fileName) {
    const apiBase = `${window.location.protocol}//${window.location.host}`;
    const params = new URLSearchParams({ job: jobId, api: apiBase });
    if (fileName) params.set('name', fileName);
    if (apiKey) params.set('key', apiKey);
    return `${VIEWER_BASE_URL}?${params}`;
  }

  // ── Detail panel ──

  function closeDetail() {
    document.getElementById('detailOverlay').classList.remove('open');
  }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });

  async function openDetail(jobId) {
    const overlay = document.getElementById('detailOverlay');
    const body = document.getElementById('detailBody');
    const title = document.getElementById('detailTitle');
    const badge = document.getElementById('detailBadge');

    overlay.classList.add('open');
    body.innerHTML = '<div class="detail-loading">Laden…</div>';
    title.textContent = jobId.slice(0, 8) + '…';
    badge.textContent = '';
    badge.className = 'badge';

    try {
      const r = await fetch(`/api/v1/jobs/${jobId}`, { headers: headers() });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const job = await r.json();
      renderDetail(job);
    } catch (e) {
      body.innerHTML = `<div class="detail-loading">Fout: ${escapeHtml(e.message)}</div>`;
    }
  }

  function renderDetail(job) {
    const title = document.getElementById('detailTitle');
    const badge = document.getElementById('detailBadge');
    const body = document.getElementById('detailBody');

    const res = job.result || {};
    const fname = res.file || job.job_id;
    title.textContent = fname;
    badge.textContent = job.status;
    badge.className = `badge ${job.status}`;

    let html = '';

    // ── Overview section ──
    html += '<div class="detail-section"><h3>Overzicht</h3><div class="detail-grid">';
    html += detailItem('Job ID', job.job_id, true);
    html += detailItem('Bestand', fname);
    html += detailItem('Status', job.status);
    if (job.created_at) html += detailItem('Aangemaakt', fmtDate(job.created_at));
    if (job.started_at && job.completed_at) {
      const dur = (new Date(job.completed_at) - new Date(job.started_at)) / 1000;
      html += detailItem('Duur', dur < 60 ? `${dur.toFixed(1)}s` : `${(dur/60).toFixed(1)}m`);
    }
    if (job.error) html += detailItem('Fout', job.error);
    html += '</div>';
    if (job.status === 'completed') {
      const viewerUrl = buildViewerUrl(job.job_id, res.file);
      html += `<a class="viewer-btn" href="${escapeHtml(viewerUrl)}" target="_blank" rel="noopener">🔬 Bekijk in 3D Viewer</a>`;
    }
    html += '</div>';

    if (!res.file) { body.innerHTML = html; return; }

    const isAssembly = !!res.is_assembly;

    // ── Classification ──
    html += '<div class="detail-section"><h3>Classificatie</h3><div class="detail-grid">';
    html += detailItem('Categorie', res.category || '—');
    html += detailItem('Type', res.part_type || '—');
    if (isAssembly) html += detailItem('Assembly', `${res.solid_count || (res.parts||[]).length} onderdelen`);
    html += detailItem('Dikte', res.thickness ? `${res.thickness} mm` : '—');
    html += '</div></div>';

    // ── Dimensions ──
    const dims = res.dimensions || {};
    const flat = res.flat_dimensions || {};
    if (dims.length || flat.length) {
      html += '<div class="detail-section"><h3>Afmetingen</h3><div class="detail-grid cols-3">';
      if (dims.length) {
        html += detailItem('Lengte', `${+dims.length.toFixed(2)} mm`, true);
        html += detailItem('Breedte', `${+dims.width.toFixed(2)} mm`, true);
        html += detailItem('Hoogte', `${+dims.height.toFixed(2)} mm`, true);
      }
      if (flat.length) {
        html += detailItem('Uitslag L', `${+flat.length.toFixed(2)} mm`, true);
        html += detailItem('Uitslag B', `${+flat.width.toFixed(2)} mm`, true);
        html += detailItem('', '');
      }
      html += '</div></div>';
    }

    // ── Production ──
    const prod = res.production || {};
    if (prod.holes_total || prod.bends_total) {
      html += '<div class="detail-section"><h3>Productie</h3><div class="detail-grid">';
      html += detailItem('Gaten totaal', prod.holes_total ?? 0);
      html += detailItem('Zettingen totaal', prod.bends_total ?? 0);
      if (prod.bends_up || prod.bends_down) {
        html += detailItem('Zettingen omhoog', prod.bends_up ?? 0);
        html += detailItem('Zettingen omlaag', prod.bends_down ?? 0);
      }
      html += '</div></div>';
    }

    // ── Route details ──
    const route = res.route;
    if (route) {
      html += '<div class="detail-section"><h3>Routing</h3><div class="detail-grid">';
      html += detailItem('Route categorie', route.category || '—');
      if (route.profile_label) html += detailItem('Profiel', route.profile_label);
      if (route.method) html += detailItem('Methode', route.method);
      if (route.variant) html += detailItem('Variant', route.variant);
      if (route.confidence != null) html += detailItem('Vertrouwen', `${(route.confidence * 100).toFixed(0)}%`);
      html += '</div>';
      if (route.reasoning) html += `<div class="detail-route-reason">${escapeHtml(route.reasoning)}</div>`;
      html += '</div>';
    }

    // ── AAG details ──
    const aag = res.aag_details;
    if (aag) {
      html += '<div class="detail-section"><h3>AAG Analyse</h3><div class="detail-grid">';
      if (aag.cut_length != null) html += detailItem('Snijlengte', `${+aag.cut_length.toFixed(1)} mm`, true);
      if (aag.total_cut_length != null) html += detailItem('Totale snijlengte', `${+aag.total_cut_length.toFixed(1)} mm`, true);
      if (aag.pierce_count != null) html += detailItem('Doorsteekpunten', aag.pierce_count);
      if (aag.estimated_cut_time_seconds != null) html += detailItem('Snijtijd (est.)', `${+aag.estimated_cut_time_seconds.toFixed(1)}s`, true);
      if (aag.face_count != null) html += detailItem('Vlakken', aag.face_count);
      if (aag.edge_count != null) html += detailItem('Randen', aag.edge_count);
      html += '</div>';

      // Hole detail table
      if (aag.hole_details && aag.hole_details.length) {
        html += '<h3 style="font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:#64748b;font-weight:600;margin:12px 0 6px">Gaten details</h3>';
        html += '<table class="detail-table"><thead><tr><th>#</th><th>Type</th><th>Diameter</th><th>Omtrek</th><th>IQ</th></tr></thead><tbody>';
        aag.hole_details.forEach((h, i) => {
          html += `<tr><td>${i+1}</td><td>${escapeHtml(h.type)}</td>`;
          html += `<td>${h.diameter != null ? (+h.diameter).toFixed(2) + ' mm' : '—'}</td>`;
          html += `<td>${h.perimeter != null ? (+h.perimeter).toFixed(2) + ' mm' : '—'}</td>`;
          html += `<td>${h.isoperimetric_quotient != null ? (+h.isoperimetric_quotient).toFixed(3) : '—'}</td></tr>`;
        });
        html += '</tbody></table>';
      }

      // Bend detail table
      if (aag.bend_details && aag.bend_details.length) {
        html += '<h3 style="font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:#64748b;font-weight:600;margin:12px 0 6px">Zettingen details</h3>';
        html += '<table class="detail-table"><thead><tr><th>#</th><th>Type</th><th>Hoek</th><th>Radius</th><th>Lengte</th><th>K-factor</th></tr></thead><tbody>';
        aag.bend_details.forEach((b, i) => {
          html += `<tr><td>${i+1}</td><td>${escapeHtml(b.type)}</td>`;
          html += `<td>${b.angle != null ? (+b.angle).toFixed(1) + '°' : '—'}</td>`;
          html += `<td>${b.radius != null ? (+b.radius).toFixed(2) + ' mm' : '—'}</td>`;
          html += `<td>${b.length != null ? (+b.length).toFixed(2) + ' mm' : '—'}</td>`;
          html += `<td>${b.k_factor != null ? (+b.k_factor).toFixed(3) : '—'}</td></tr>`;
        });
        html += '</tbody></table>';
      }
      html += '</div>';
    }

    // ── Unfold status ──
    const unfold = job.unfold;
    if (unfold && unfold.status !== 'idle') {
      html += '<div class="detail-section"><h3>Unfold</h3><div class="detail-grid">';
      html += detailItem('Status', unfold.status);
      if (unfold.result) {
        const ur = unfold.result;
        if (ur.flat_length != null) html += detailItem('Uitslag L', `${(+ur.flat_length).toFixed(2)} mm`, true);
        if (ur.flat_width != null) html += detailItem('Uitslag B', `${(+ur.flat_width).toFixed(2)} mm`, true);
        html += detailItem('Zetlijnen', ur.fold_lines ?? '—');
        if (ur.raw_fold_lines != null) html += detailItem('Raw zetlijnen', ur.raw_fold_lines);
      }
      if (unfold.error) html += detailItem('Fout', unfold.error);
      html += '</div></div>';
    }

    // ── Timeline visualization ──
    const events = job.timeline_events || [];
    if (events.length) {
      html += '<div class="detail-section"><h3>Timeline</h3>';
      html += renderTimeline(events, job.timeline_summary);
      html += '</div>';
    }

    // ── Assembly parts ──
    if (isAssembly && res.parts && res.parts.length) {
      html += '<div class="detail-section"><h3>Onderdelen</h3><div class="detail-parts-list">';
      res.parts.forEach((p, i) => {
        const pd = p.dimensions || {};
        const pp = p.production || {};
        html += '<div class="detail-part-card">';
        html += `<h4>${escapeHtml(p.solid_name || `Onderdeel ${i+1}`)}</h4>`;
        html += '<div class="detail-grid cols-3">';
        html += detailItem('Categorie', p.category || p.part_type || '—');
        html += detailItem('Dikte', p.thickness ? `${p.thickness} mm` : '—', true);
        if (pd.length) html += detailItem('L×B×H', `${+pd.length.toFixed(1)} × ${+pd.width.toFixed(1)} × ${+pd.height.toFixed(1)}`, true);
        html += detailItem('Gaten', pp.holes_total ?? '—');
        html += detailItem('Zettingen', pp.bends_total ?? '—');
        html += '</div></div>';
      });
      html += '</div></div>';
    }

    body.innerHTML = html;
  }

  function detailItem(label, value, mono) {
    return `<div class="detail-item"><span class="dlabel">${escapeHtml(label)}</span><span class="dvalue${mono ? ' mono' : ''}">${escapeHtml(String(value ?? '—'))}</span></div>`;
  }

  function fmtDate(iso) {
    try {
      return new Date(iso).toLocaleString('nl-NL', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit' });
    } catch { return iso; }
  }

  const STAGE_COLORS = [
    '#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6',
    '#ec4899','#14b8a6','#f97316','#6366f1','#84cc16',
  ];

  function renderTimeline(events, summary) {
    const stageMap = new Map();
    events.forEach(e => {
      if (e.type === 'stage_start') stageMap.set(e.stage, { start: e.timestamp_ms });
      if (e.type === 'stage_end' && stageMap.has(e.stage)) stageMap.get(e.stage).end = e.timestamp_ms;
    });

    const stages = [];
    stageMap.forEach((v, k) => { if (v.end) stages.push({ name: k, dur: v.end - v.start }); });
    if (!stages.length) return `<div style="font-size:11px;color:#94a3b8">${events.length} events ontvangen</div>`;

    const total = stages.reduce((s, st) => s + st.dur, 0) || 1;
    let html = '<div class="timeline-bar">';
    stages.forEach((st, i) => {
      const pct = Math.max(1, (st.dur / total) * 100);
      const color = STAGE_COLORS[i % STAGE_COLORS.length];
      html += `<div class="timeline-segment" style="width:${pct}%;background:${color}" title="${escapeHtml(st.name)}: ${(st.dur/1000).toFixed(2)}s"><span>${escapeHtml(st.name)}</span></div>`;
    });
    html += '</div>';
    html += '<div class="timeline-legend">';
    stages.forEach((st, i) => {
      const color = STAGE_COLORS[i % STAGE_COLORS.length];
      html += `<div class="timeline-legend-item"><div class="timeline-legend-dot" style="background:${color}"></div>${escapeHtml(st.name)} ${(st.dur/1000).toFixed(2)}s</div>`;
    });
    html += '</div>';
    if (summary?.total_elapsed_seconds) {
      html += `<div style="margin-top:6px;font-size:10px;color:#64748b">Totaal: ${(+summary.total_elapsed_seconds).toFixed(2)}s · ${summary.event_count || events.length} events · ${summary.step_count || stages.length} stappen</div>`;
    }
    return html;
  }

  loadAll();
</script>
</body>
</html>
