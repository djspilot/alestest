<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALES API</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: ui-monospace, 'SF Mono', monospace; background: #f5f7fb; color: #111827; font-size: 13px; }

  header { display: flex; align-items: center; gap: 16px; padding: 16px 24px; border-bottom: 1px solid #d8dee8; background: #ffffff; }
  header h1 { font-size: 14px; font-weight: 600; letter-spacing: 0.05em; color: #0f172a; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #94a3b8; flex-shrink: 0; }
  .dot.ok { background: #22c55e; box-shadow: 0 0 6px #22c55e88; }
  .dot.err { background: #ef4444; }
  .uptime { margin-left: auto; color: #64748b; font-size: 11px; }

  .key-bar { display: flex; gap: 8px; padding: 12px 24px; background: #eef2f7; border-bottom: 1px solid #d8dee8; }
  .key-bar input { flex: 1; background: #ffffff; border: 1px solid #cbd5e1; color: #111827; padding: 6px 10px; border-radius: 4px; font-family: inherit; font-size: 12px; }
  .key-bar input:focus { outline: none; border-color: #64748b; box-shadow: 0 0 0 3px rgba(100,116,139,0.12); }
  .key-bar input::placeholder { color: #94a3b8; }
  .key-bar button { background: #ffffff; border: 1px solid #cbd5e1; color: #0f172a; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 12px; }
  .key-bar button:hover { background: #e2e8f0; color: #020617; }

  .stats { display: flex; gap: 1px; background: #d8dee8; border-bottom: 1px solid #d8dee8; }
  .stat { flex: 1; padding: 14px 20px; background: #ffffff; }
  .stat-label { color: #64748b; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
  .stat-value { font-size: 22px; font-weight: 700; color: #0f172a; }
  .stat-value.green { color: #22c55e; }
  .stat-value.red { color: #ef4444; }
  .stat-value.yellow { color: #eab308; }

  .toolbar { display: flex; align-items: center; gap: 12px; padding: 10px 24px; border-bottom: 1px solid #d8dee8; background: #ffffff; }
  .toolbar span { color: #64748b; font-size: 11px; }
  .refresh-btn { margin-left: auto; background: #ffffff; border: 1px solid #cbd5e1; color: #334155; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 11px; }
  .refresh-btn:hover { border-color: #94a3b8; color: #0f172a; background: #f8fafc; }
  a.docs-link { color: #475569; font-size: 11px; text-decoration: none; }
  a.docs-link:hover { color: #0f172a; }

  .upload-bar { display: flex; align-items: center; gap: 10px; padding: 12px 24px; background: #eef2f7; border-bottom: 1px solid #d8dee8; }
  .upload-btn { background: #ecfdf5; border: 1px solid #86efac; color: #166534; padding: 6px 16px; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 12px; }
  .upload-btn:hover { background: #dcfce7; }
  .upload-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #uploadInput { display: none; }
  #uploadStatus { font-size: 11px; color: #64748b; }

  table { width: 100%; border-collapse: collapse; }
  thead tr { border-bottom: 1px solid #d8dee8; background: #f8fafc; }
  th { padding: 8px 12px; text-align: left; font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
  tbody tr { border-bottom: 1px solid #e5e7eb; transition: background 0.1s; background: #ffffff; }
  tbody tr:hover { background: #f8fafc; }
  td { padding: 10px 12px; color: #334155; }
  td.file { color: #0f172a; font-weight: 600; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.mono { font-family: ui-monospace, monospace; font-size: 11px; color: #475569; }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 10px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .badge.completed { background: #14532d; color: #4ade80; }
  .badge.failed    { background: #450a0a; color: #f87171; }
  .badge.processing{ background: #1c1917; color: #fbbf24; }
  .badge.queued    { background: #1e1b4b; color: #818cf8; }
  .badge.idle      { background: #e2e8f0; color: #475569; }
  .badge.unfold-completed { background: #ccfbf1; color: #115e59; }
  .badge.assembly { background: #e0e7ff; color: #4338ca; }

  .action-cell { min-width: 210px; }

  .assembly-parts { display: none; background: #f8fafc; }
  .assembly-parts.open { display: table-row-group; }
  .assembly-part-row td { padding: 6px 12px 6px 32px; border-bottom: 1px solid #e5e7eb; color: #475569; font-size: 11px; }
  .assembly-part-row td.part-name { color: #0f172a; font-weight: 500; }
  .expand-btn { background: #ffffff; border: 1px solid #cbd5e1; color: #334155; padding: 2px 8px; border-radius: 3px; cursor: pointer; font-family: inherit; font-size: 11px; }
  .expand-btn:hover { border-color: #94a3b8; color: #0f172a; }
  .action-stack { display: flex; flex-direction: column; gap: 6px; }
  .action-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .mini-btn, .artifact-link { background: #ffffff; border: 1px solid #cbd5e1; color: #0f172a; padding: 4px 8px; border-radius: 4px; font-family: inherit; font-size: 11px; text-decoration: none; cursor: pointer; }
  .mini-btn:hover, .artifact-link:hover { border-color: #94a3b8; color: #020617; background: #f8fafc; }
  .mini-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .download-menu { position: relative; }
  .download-menu summary { list-style: none; }
  .download-menu summary::-webkit-details-marker { display: none; }
  .download-trigger { min-width: 94px; text-align: center; }
  .download-panel { position: absolute; top: calc(100% + 6px); right: 0; z-index: 20; min-width: 200px; padding: 6px; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 6px; box-shadow: 0 12px 24px rgba(15,23,42,0.12); }
  .download-item { display: block; width: 100%; background: transparent; border: 0; color: #0f172a; text-align: left; padding: 7px 8px; border-radius: 4px; font-family: inherit; font-size: 11px; text-decoration: none; cursor: pointer; }
  .download-item:hover { background: #f1f5f9; color: #020617; }
  .download-item.disabled { color: #94a3b8; cursor: default; pointer-events: none; }
  .subtle { font-size: 10px; color: #64748b; }

  .empty { padding: 60px; text-align: center; color: #94a3b8; }
  .error-msg { padding: 12px 24px; color: #ef4444; font-size: 11px; }
  #autoRefreshLabel { font-size: 10px; color: #64748b; }
</style>
</head>
<body>

<header>
  <div class="dot" id="healthDot"></div>
  <h1>ALES · Manufacturing API</h1>
  <span class="uptime" id="healthLabel">verbinden…</span>
</header>

<div class="key-bar">
  <input type="password" id="apiKeyInput" placeholder="API key (opgeslagen in browser)" autocomplete="off">
  <button onclick="saveKey()">Opslaan</button>
</div>

<div class="stats">
  <div class="stat"><div class="stat-label">Totaal</div><div class="stat-value" id="sTotal">—</div></div>
  <div class="stat"><div class="stat-label">Geslaagd</div><div class="stat-value green" id="sOk">—</div></div>
  <div class="stat"><div class="stat-label">Mislukt</div><div class="stat-value red" id="sFail">—</div></div>
  <div class="stat"><div class="stat-label">Bezig</div><div class="stat-value yellow" id="sProc">—</div></div>
</div>

<div class="upload-bar">
  <input type="file" id="uploadInput" accept=".step,.stp" multiple>
  <button class="upload-btn" id="uploadBtn" onclick="document.getElementById('uploadInput').click()">+ STEP uploaden</button>
  <span id="uploadStatus"></span>
</div>

<div class="toolbar">
  <span id="autoRefreshLabel"></span>
  <a class="docs-link" href="/docs" target="_blank">→ API docs</a>
  <button class="refresh-btn" onclick="loadAll()">↻ Ververs</button>
</div>

<div id="errorMsg" class="error-msg" style="display:none"></div>
<table>
  <thead>
    <tr>
      <th>Bestand</th>
      <th>Status</th>
      <th>Categorie</th>
      <th>Type</th>
      <th>Dikte</th>
      <th>L × B × H (mm)</th>
      <th>Gaten</th>
      <th>Zettingen</th>
      <th>Tijd</th>
      <th>Duur</th>
      <th>Acties</th>
    </tr>
  </thead>
  <tbody id="jobTable">
    <tr><td colspan="11" class="empty">Laden…</td></tr>
  </tbody>
</table>

<script>
  const KEY_STORE = 'ales_api_key';
  let apiKey = localStorage.getItem(KEY_STORE) || '';
  let refreshTimer = null;
  const REFRESH_INTERVAL = 30;

  document.getElementById('apiKeyInput').value = apiKey;

  function saveKey() {
    apiKey = document.getElementById('apiKeyInput').value.trim();
    localStorage.setItem(KEY_STORE, apiKey);
    loadAll();
  }

  document.getElementById('apiKeyInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') saveKey();
  });

  function headers() {
    return apiKey ? { 'X-API-Key': apiKey } : {};
  }

  function escapeHtml(value) {
    return String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#39;');
  }

  function renderUnfoldActions(job) {
    const unfold = job.unfold || { status: 'idle' };
    const unfoldStatus = unfold.status || 'idle';
    const unfoldResult = unfold.result || null;
    const unfoldBadgeClass = unfoldStatus === 'completed' ? 'unfold-completed' : unfoldStatus;
    const statusBadge = `<span class="badge ${unfoldBadgeClass}">${escapeHtml(unfoldStatus)}</span>`;
    const canQueue = job.status === 'completed' && !['queued', 'processing'].includes(unfoldStatus);
    const unfoldError = unfold.error ? `<div class="subtle">${escapeHtml(unfold.error)}</div>` : '';
    const foldSummary = unfoldResult?.fold_lines != null
      ? `<div class="subtle">zetlijnen ${escapeHtml(unfoldResult.fold_lines)} / raw ${escapeHtml(unfoldResult.raw_fold_lines ?? '—')}</div>`
      : '';
    const downloadItems = [];
    if (job.status === 'completed') {
      const fileStem = escapeHtml((job.file_name || job.job_id).replace(/\.[^.]+$/, ''));
      downloadItems.push(
        `<a class="download-item" href="#" onclick="downloadArtifact(event,'/api/v1/jobs/${escapeHtml(job.job_id)}/downloads/total-xml','${fileStem}.xml')">Totale XML</a>`,
      );
      downloadItems.push(
        `<a class="download-item" href="#" onclick="downloadArtifact(event,'/api/v1/jobs/${escapeHtml(job.job_id)}/downloads/part-xmls','${fileStem}_xml.zip')">Losse XML's (.zip)</a>`,
      );
      if (unfoldStatus === 'completed') {
        downloadItems.push(
          `<a class="download-item" href="#" onclick="downloadArtifact(event,'/api/v1/jobs/${escapeHtml(job.job_id)}/downloads/unfold-files','${fileStem}_unfold.zip')">Unfold map (.zip)</a>`,
        );
      }
      if (unfoldResult?.flat_step_url) {
        downloadItems.push(`<a class="download-item" href="#" onclick="downloadArtifact(event,'${escapeHtml(unfoldResult.flat_step_url)}','${fileStem}_flat.step')">Flat STEP</a>`);
      }
      if (unfoldResult?.dxf_url) {
        downloadItems.push(`<a class="download-item" href="#" onclick="downloadArtifact(event,'${escapeHtml(unfoldResult.dxf_url)}','${fileStem}_flat.dxf')">DXF</a>`);
      }
    }

    const downloadMenu = downloadItems.length
      ? `<details class="download-menu">
          <summary class="mini-btn download-trigger">Downloads ▾</summary>
          <div class="download-panel">${downloadItems.join('')}</div>
        </details>`
      : '';

    return `
      <div class="action-stack">
        <div class="action-row">
          ${statusBadge}
          <button class="mini-btn" onclick="requestUnfold('${escapeHtml(job.job_id)}')" ${canQueue ? '' : 'disabled'}>
            ${unfoldStatus === 'completed' ? 'Opnieuw unfolden' : 'Unfold'}
          </button>
          ${downloadMenu}
        </div>
        ${foldSummary}
        ${unfoldError}
      </div>
    `;
  }

  async function downloadArtifact(event, url, filename) {
    event.preventDefault();
    const errEl = document.getElementById('errorMsg');
    try {
      const r = await fetch(url, { headers: headers() });
      if (r.status === 401) throw new Error('401 — Vul een geldige API key in.');
      if (!r.ok) {
        let detail = `HTTP ${r.status}`;
        try { detail = (await r.json()).detail || detail; } catch {}
        throw new Error(detail);
      }
      const blob = await r.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 10000);
      errEl.style.display = 'none';
    } catch (e) {
      errEl.style.display = '';
      errEl.textContent = `Download mislukt: ${e.message}`;
    }
  }

  async function requestUnfold(jobId) {
    const errEl = document.getElementById('errorMsg');
    try {
      const r = await fetch(`/api/v1/jobs/${jobId}/unfold`, {
        method: 'POST',
        headers: headers(),
      });
      if (r.status === 401) throw new Error('401 — Vul een geldige API key in.');
      if (!r.ok) {
        let detail = `HTTP ${r.status}`;
        try {
          const payload = await r.json();
          detail = payload.detail || detail;
        } catch {}
        throw new Error(detail);
      }
      errEl.style.display = 'none';
      await loadJobs();
    } catch (error) {
      errEl.style.display = '';
      errEl.textContent = error.message;
    }
  }

  async function checkHealth() {
    const dot = document.getElementById('healthDot');
    const label = document.getElementById('healthLabel');
    try {
      const r = await fetch('/api/v1/health');
      if (r.ok) {
        dot.className = 'dot ok';
        label.textContent = 'online';
      } else {
        dot.className = 'dot err';
        label.textContent = `HTTP ${r.status}`;
      }
    } catch {
      dot.className = 'dot err';
      label.textContent = 'niet bereikbaar';
    }
  }

  async function loadStats() {
    try {
      const r = await fetch('/api/v1/stats', { headers: headers() });
      if (!r.ok) return;
      const d = await r.json();
      document.getElementById('sTotal').textContent = d.total ?? '—';
      document.getElementById('sOk').textContent    = d.completed ?? '—';
      document.getElementById('sFail').textContent  = d.failed ?? '—';
      document.getElementById('sProc').textContent  = d.processing ?? '—';
    } catch {}
  }

  async function loadJobs() {
    const tbody = document.getElementById('jobTable');
    const errEl = document.getElementById('errorMsg');
    try {
      const r = await fetch('/api/v1/jobs?limit=50&offset=0', { headers: headers() });
      if (r.status === 401) {
        errEl.style.display = '';
        errEl.textContent = '401 — Vul een geldige API key in.';
        tbody.innerHTML = '<tr><td colspan="11" class="empty">Geen toegang</td></tr>';
        return;
      }
      errEl.style.display = 'none';
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const data = await r.json();
      const items = data.items || [];

      if (!items.length) {
        tbody.innerHTML = '<tr><td colspan="11" class="empty">Nog geen jobs</td></tr>';
        return;
      }

      tbody.innerHTML = items.map(job => {
        const res = job.result || {};
        const isAssembly = !!res.is_assembly;
        const parts = res.parts || [];
        const prod = res.production || {};
        const dims = res.dimensions || {};
        const created = new Date(job.created_at);
        const timeStr = created.toLocaleString('nl-NL', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });

        let dur = '—';
        if (job.started_at && job.completed_at) {
          const s = (new Date(job.completed_at) - new Date(job.started_at)) / 1000;
          dur = s < 60 ? `${s.toFixed(0)}s` : `${(s/60).toFixed(1)}m`;
        }

        let cat, type, thick, holes, bends, dimStr, expandBtn = '', partRows = '';

        if (isAssembly) {
          const n = res.solid_count || parts.length;
          cat = `<span class="badge assembly">Assembly · ${n}×</span>`;
          type = '—';
          thick = '—';
          dimStr = '—';
          holes = parts.reduce((s, p) => s + (p.production?.holes_total ?? 0), 0) || '—';
          bends = parts.reduce((s, p) => s + (p.production?.bends_total ?? 0), 0) || '—';

          const rowId = `parts-${escapeHtml(job.job_id)}`;
          expandBtn = `<button class="expand-btn" onclick="toggleParts('${rowId}')">▶ Onderdelen</button>`;

          partRows = `<tr class="assembly-parts" id="${rowId}"><td colspan="11" style="padding:0">
            <table style="width:100%">
              ${parts.map((p, i) => {
                const pd = p.dimensions || {};
                const pp = p.production || {};
                const pdim = pd.length ? `${+pd.length.toFixed(1)} × ${+pd.width.toFixed(1)} × ${+pd.height.toFixed(1)}` : '—';
                const pcat = escapeHtml(p.category || p.part_type || '—');
                const pthick = p.thickness ? `${p.thickness} mm` : '—';
                return `<tr class="assembly-part-row">
                  <td class="part-name">${escapeHtml(p.solid_name || `Onderdeel ${i+1}`)}</td>
                  <td>${pcat}</td>
                  <td class="mono">${pthick}</td>
                  <td class="mono">${pdim}</td>
                  <td class="mono">${pp.holes_total ?? '—'} gaten</td>
                  <td class="mono">${pp.bends_total ?? '—'} zett.</td>
                  <td colspan="5"></td>
                </tr>`;
              }).join('')}
            </table>
          </td></tr>`;
        } else {
          dimStr = dims.length
            ? `${+dims.length.toFixed(1)} × ${+dims.width.toFixed(1)} × ${+dims.height.toFixed(1)}`
            : '—';
          cat = escapeHtml(res.category || '—');
          type = escapeHtml(res.part_type || '—');
          thick = res.thickness ? `${res.thickness} mm` : '—';
          holes = prod.holes_total ?? '—';
          bends = prod.bends_total ?? '—';
        }

        const badge = `<span class="badge ${job.status}">${job.status}</span>`;
        const fname = job.file_name || res.file || job.job_id.slice(0,8);
        const actions = renderUnfoldActions(job);

        return `<tr>
          <td class="file" title="${escapeHtml(fname)}">${escapeHtml(fname)}</td>
          <td>${badge}</td>
          <td>${cat}</td>
          <td>${type}</td>
          <td class="mono">${thick}</td>
          <td class="mono">${dimStr}</td>
          <td class="mono">${holes}</td>
          <td class="mono">${bends}</td>
          <td class="mono">${timeStr}</td>
          <td class="mono">${dur}</td>
          <td class="action-cell">${actions}${expandBtn ? '<div style="margin-top:6px">'+expandBtn+'</div>' : ''}</td>
        </tr>${partRows}`;
      }).join('');
    } catch (e) {
      tbody.innerHTML = `<tr><td colspan="11" class="empty">Fout: ${escapeHtml(e.message)}</td></tr>`;
    }
  }

  function startAutoRefresh() {
    if (refreshTimer) clearInterval(refreshTimer);
    let countdown = REFRESH_INTERVAL;
    const label = document.getElementById('autoRefreshLabel');
    label.textContent = `Auto-refresh over ${countdown}s`;
    refreshTimer = setInterval(() => {
      countdown--;
      if (countdown <= 0) {
        countdown = REFRESH_INTERVAL;
        loadAll();
      }
      label.textContent = `Auto-refresh over ${countdown}s`;
    }, 1000);
  }

  async function loadAll() {
    await Promise.all([checkHealth(), loadStats(), loadJobs()]);
    startAutoRefresh();
  }

  document.getElementById('uploadInput').addEventListener('change', async function() {
    const files = Array.from(this.files);
    if (!files.length) return;
    const btn = document.getElementById('uploadBtn');
    const status = document.getElementById('uploadStatus');
    btn.disabled = true;
    status.textContent = `Uploaden (0/${files.length})…`;
    let done = 0;
    for (const file of files) {
      try {
        const fd = new FormData();
        fd.append('file', file);
        const r = await fetch('/api/v1/analyze', { method: 'POST', headers: headers(), body: fd });
        if (!r.ok) { status.textContent = `Fout bij ${file.name}: HTTP ${r.status}`; break; }
        done++;
        status.textContent = done < files.length ? `Uploaden (${done}/${files.length})…` : `${done} bestand(en) geüpload ✓`;
      } catch (e) {
        status.textContent = `Fout: ${e.message}`;
        break;
      }
    }
    btn.disabled = false;
    this.value = '';
    setTimeout(() => loadAll(), 500);
  });

  function toggleParts(rowId) {
    const el = document.getElementById(rowId);
    if (!el) return;
    const open = el.classList.toggle('open');
    const btn = el.previousElementSibling?.querySelector('.expand-btn');
    if (btn) btn.textContent = open ? '▼ Onderdelen' : '▶ Onderdelen';
  }

  loadAll();
</script>
</body>
</html>
