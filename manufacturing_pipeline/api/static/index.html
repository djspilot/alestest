<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALES API</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: ui-monospace, 'SF Mono', monospace; background: #0d0d0d; color: #e0e0e0; font-size: 13px; }

  header { display: flex; align-items: center; gap: 16px; padding: 16px 24px; border-bottom: 1px solid #222; }
  header h1 { font-size: 14px; font-weight: 600; letter-spacing: 0.05em; color: #fff; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #444; flex-shrink: 0; }
  .dot.ok { background: #22c55e; box-shadow: 0 0 6px #22c55e88; }
  .dot.err { background: #ef4444; }
  .uptime { margin-left: auto; color: #555; font-size: 11px; }

  .key-bar { display: flex; gap: 8px; padding: 12px 24px; background: #111; border-bottom: 1px solid #1e1e1e; }
  .key-bar input { flex: 1; background: #1a1a1a; border: 1px solid #2a2a2a; color: #ccc; padding: 6px 10px; border-radius: 4px; font-family: inherit; font-size: 12px; }
  .key-bar input:focus { outline: none; border-color: #444; }
  .key-bar input::placeholder { color: #444; }
  .key-bar button { background: #222; border: 1px solid #333; color: #aaa; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 12px; }
  .key-bar button:hover { background: #2a2a2a; color: #fff; }

  .stats { display: flex; gap: 1px; background: #1a1a1a; border-bottom: 1px solid #222; }
  .stat { flex: 1; padding: 14px 20px; background: #0d0d0d; }
  .stat-label { color: #555; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
  .stat-value { font-size: 22px; font-weight: 700; color: #fff; }
  .stat-value.green { color: #22c55e; }
  .stat-value.red { color: #ef4444; }
  .stat-value.yellow { color: #eab308; }

  .toolbar { display: flex; align-items: center; gap: 12px; padding: 10px 24px; border-bottom: 1px solid #1e1e1e; }
  .toolbar span { color: #555; font-size: 11px; }
  .refresh-btn { margin-left: auto; background: none; border: 1px solid #2a2a2a; color: #666; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 11px; }
  .refresh-btn:hover { border-color: #444; color: #aaa; }
  a.docs-link { color: #555; font-size: 11px; text-decoration: none; }
  a.docs-link:hover { color: #aaa; }

  table { width: 100%; border-collapse: collapse; }
  thead tr { border-bottom: 1px solid #1e1e1e; }
  th { padding: 8px 12px; text-align: left; font-size: 10px; color: #444; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 500; }
  tbody tr { border-bottom: 1px solid #131313; transition: background 0.1s; }
  tbody tr:hover { background: #111; }
  td { padding: 10px 12px; color: #bbb; }
  td.file { color: #fff; font-weight: 500; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.mono { font-family: ui-monospace, monospace; font-size: 11px; color: #888; }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 10px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .badge.completed { background: #14532d; color: #4ade80; }
  .badge.failed    { background: #450a0a; color: #f87171; }
  .badge.processing{ background: #1c1917; color: #fbbf24; }
  .badge.queued    { background: #1e1b4b; color: #818cf8; }

  .empty { padding: 60px; text-align: center; color: #333; }
  .error-msg { padding: 12px 24px; color: #ef4444; font-size: 11px; }
  #autoRefreshLabel { font-size: 10px; color: #333; }
</style>
</head>
<body>

<header>
  <div class="dot" id="healthDot"></div>
  <h1>ALES · Manufacturing API</h1>
  <span class="uptime" id="healthLabel">verbinden…</span>
</header>

<div class="key-bar">
  <input type="password" id="apiKeyInput" placeholder="API key (opgeslagen in browser)" autocomplete="off">
  <button onclick="saveKey()">Opslaan</button>
</div>

<div class="stats">
  <div class="stat"><div class="stat-label">Totaal</div><div class="stat-value" id="sTotal">—</div></div>
  <div class="stat"><div class="stat-label">Geslaagd</div><div class="stat-value green" id="sOk">—</div></div>
  <div class="stat"><div class="stat-label">Mislukt</div><div class="stat-value red" id="sFail">—</div></div>
  <div class="stat"><div class="stat-label">Bezig</div><div class="stat-value yellow" id="sProc">—</div></div>
</div>

<div class="toolbar">
  <span id="autoRefreshLabel"></span>
  <a class="docs-link" href="/docs" target="_blank">→ API docs</a>
  <button class="refresh-btn" onclick="loadAll()">↻ Ververs</button>
</div>

<div id="errorMsg" class="error-msg" style="display:none"></div>
<table>
  <thead>
    <tr>
      <th>Bestand</th>
      <th>Status</th>
      <th>Categorie</th>
      <th>Type</th>
      <th>Dikte</th>
      <th>L × B × H (mm)</th>
      <th>Gaten</th>
      <th>Zettingen</th>
      <th>Tijd</th>
      <th>Duur</th>
    </tr>
  </thead>
  <tbody id="jobTable">
    <tr><td colspan="10" class="empty">Laden…</td></tr>
  </tbody>
</table>

<script>
  const KEY_STORE = 'ales_api_key';
  let apiKey = localStorage.getItem(KEY_STORE) || '';
  let refreshTimer = null;
  const REFRESH_INTERVAL = 30;

  document.getElementById('apiKeyInput').value = apiKey;

  function saveKey() {
    apiKey = document.getElementById('apiKeyInput').value.trim();
    localStorage.setItem(KEY_STORE, apiKey);
    loadAll();
  }

  document.getElementById('apiKeyInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') saveKey();
  });

  function headers() {
    return apiKey ? { 'X-API-Key': apiKey } : {};
  }

  async function checkHealth() {
    const dot = document.getElementById('healthDot');
    const label = document.getElementById('healthLabel');
    try {
      const r = await fetch('/api/v1/health');
      if (r.ok) {
        dot.className = 'dot ok';
        label.textContent = 'online';
      } else {
        dot.className = 'dot err';
        label.textContent = `HTTP ${r.status}`;
      }
    } catch {
      dot.className = 'dot err';
      label.textContent = 'niet bereikbaar';
    }
  }

  async function loadStats() {
    try {
      const r = await fetch('/api/v1/stats', { headers: headers() });
      if (!r.ok) return;
      const d = await r.json();
      document.getElementById('sTotal').textContent = d.total ?? '—';
      document.getElementById('sOk').textContent    = d.completed ?? '—';
      document.getElementById('sFail').textContent  = d.failed ?? '—';
      document.getElementById('sProc').textContent  = d.processing ?? '—';
    } catch {}
  }

  async function loadJobs() {
    const tbody = document.getElementById('jobTable');
    const errEl = document.getElementById('errorMsg');
    try {
      const r = await fetch('/api/v1/jobs?limit=50&offset=0', { headers: headers() });
      if (r.status === 401) {
        errEl.style.display = '';
        errEl.textContent = '401 — Vul een geldige API key in.';
        tbody.innerHTML = '<tr><td colspan="10" class="empty">Geen toegang</td></tr>';
        return;
      }
      errEl.style.display = 'none';
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const data = await r.json();
      const items = data.items || [];

      if (!items.length) {
        tbody.innerHTML = '<tr><td colspan="10" class="empty">Nog geen jobs</td></tr>';
        return;
      }

      tbody.innerHTML = items.map(job => {
        const res = job.result || {};
        const prod = res.production || {};
        const dims = res.dimensions || {};
        const created = new Date(job.created_at);
        const timeStr = created.toLocaleString('nl-NL', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });

        let dur = '—';
        if (job.started_at && job.completed_at) {
          const s = (new Date(job.completed_at) - new Date(job.started_at)) / 1000;
          dur = s < 60 ? `${s.toFixed(0)}s` : `${(s/60).toFixed(1)}m`;
        }

        const dimStr = dims.length
          ? `${+dims.length.toFixed(1)} × ${+dims.width.toFixed(1)} × ${+dims.height.toFixed(1)}`
          : '—';

        const badge = `<span class="badge ${job.status}">${job.status}</span>`;
        const cat = res.category || '—';
        const type = res.part_type || '—';
        const thick = res.thickness ? `${res.thickness} mm` : '—';
        const holes = prod.holes_total ?? '—';
        const bends = prod.bends_total ?? '—';
        const fname = job.file_name || res.file || job.job_id.slice(0,8);

        return `<tr>
          <td class="file" title="${fname}">${fname}</td>
          <td>${badge}</td>
          <td>${cat}</td>
          <td>${type}</td>
          <td class="mono">${thick}</td>
          <td class="mono">${dimStr}</td>
          <td class="mono">${holes}</td>
          <td class="mono">${bends}</td>
          <td class="mono">${timeStr}</td>
          <td class="mono">${dur}</td>
        </tr>`;
      }).join('');
    } catch (e) {
      tbody.innerHTML = `<tr><td colspan="10" class="empty">Fout: ${e.message}</td></tr>`;
    }
  }

  function startAutoRefresh() {
    if (refreshTimer) clearInterval(refreshTimer);
    let countdown = REFRESH_INTERVAL;
    const label = document.getElementById('autoRefreshLabel');
    label.textContent = `Auto-refresh over ${countdown}s`;
    refreshTimer = setInterval(() => {
      countdown--;
      if (countdown <= 0) {
        countdown = REFRESH_INTERVAL;
        loadAll();
      }
      label.textContent = `Auto-refresh over ${countdown}s`;
    }, 1000);
  }

  async function loadAll() {
    await Promise.all([checkHealth(), loadStats(), loadJobs()]);
    startAutoRefresh();
  }

  loadAll();
</script>
</body>
</html>
