server {
    listen 80;
    server_name api.example.com;

    # Allow large STEP file uploads (up to 100MB)
    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Analysis can take several minutes for complex parts
        proxy_read_timeout 600s;
        proxy_connect_timeout 10s;
    }
}

# After placing this in /etc/nginx/sites-available/ and enabling it:
#   sudo ln -s /etc/nginx/sites-available/manufacturing-api /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Then add SSL with certbot:
#   sudo certbot --nginx -d api.example.com
