services:
  api:
    image: ghcr.io/djspilot/alestest-api:latest
    container_name: ales-api
    restart: unless-stopped
    environment:
      API_KEYS: ${API_KEYS}
      UPLOAD_DIR: /srv/alestest/uploads
      DB_PATH: /srv/alestest/data/db/manufacturing_data.db
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-100}
      JOB_TTL_SECONDS: ${JOB_TTL_SECONDS:-3600}
      FREECAD_AUTO_INSTALL: "0"
      DISABLE_STAGES: ${DISABLE_STAGES:-unfold}
    volumes:
      - ales_uploads:/srv/alestest/uploads
      - ales_db:/srv/alestest/data/db
    ports:
      - "127.0.0.1:8000:8000"


volumes:
  ales_uploads:
  ales_db:
